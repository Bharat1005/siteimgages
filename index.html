<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Grid</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    padding:30px;
    background:#f5f5f5;
}

.image-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.image-item{
    overflow:hidden;
    border-radius:12px;
    background:#fff;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.image-item img{
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
    transition:0.3s;
}

.image-item img:hover{
    transform:scale(1.05);
}

/* Tablet */
@media(max-width:991px){
    .image-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

/* Mobile */
@media(max-width:576px){
    .image-grid{
        grid-template-columns:1fr;
    }

    .image-item img{
        height:220px;
    }
}
</style>
</head>

<body>

<div class="image-grid">

    <div class="image-item">
        <img src="./blog-1.png" alt="blog-1">
    </div>

     <div class="image-item">
        <img src="./best-ai.png" alt="best-ai">
    </div>

    
     <div class="image-item">
        <img src="./WordPress-React.png" alt="WordPress-React">
    </div>

    <div class="image-item">
        <img src="./figma-master-class.png" alt="figma-master-class">
    </div>

    <div class="image-item">
         <img src="./elon-musk-world-first-trillionaire-spacex-ipo-2026.png" alt="elon-musk-world-first-trillionaire-spacex-ipo-2026">
    </div>

    <div class="image-item">
        <img src="./AI-revolutionizing-web-development-in-2026.png" alt="AI-revolutionizing-web-development-in-2026">
    </div>

     <div class="image-item">
        <img src="./Figma.png">
    </div>

    <div class="image-item">
        <img src="image5.jpg" alt="Image 5">
    </div>

    <div class="image-item">
        <img src="image6.jpg" alt="Image 6">
    </div>

</div>

</body>
</html>
